        input[type=range].vertical-slider {

        const isContentSafe = (text) => !text ? true : !BANNED_WORDS.some(banned => text.toLowerCase().includes(banned));
        
        const shuffleWord = (word) => {
            let chars = word.split('').map((char, index) => ({ id: index, char, isPlaced: false }));
            if (word.length > 1) {
                let attempts = 0; let isSame = true;
                while (isSame && attempts < 20) { 
                    for (let i = chars.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [chars[i], chars[j]] = [chars[j], chars[i]];
                    }
                    if (chars.map(c => c.char).join('') !== word) isSame = false;
                    attempts++;
                }
            }
            return chars;
        };

        const generateDistractors = (syllable) => {
            const vowels = ['a', 'e', 'ı', 'i', 'o', 'ö', 'u', 'ü'];
            const upperSyllable = syllable.toLocaleLowerCase('tr');
            let vowelIndex = -1;
            for (let i = 0; i < upperSyllable.length; i++) {
                if (vowels.includes(upperSyllable[i])) { vowelIndex = i; break; }
            }
            if (vowelIndex === -1) return [syllable, syllable]; 
            const originalVowel = upperSyllable[vowelIndex];
            const distractors = [];
            for (let v of vowels) {
                if (v === originalVowel) continue; 
                const newSyllable = (upperSyllable.substring(0, vowelIndex) + v + upperSyllable.substring(vowelIndex + 1)).toLocaleUpperCase('tr');
                if (!isContentSafe(newSyllable)) continue; 
                distractors.push(newSyllable);
                if (distractors.length === 2) break; 
            }
            while (distractors.length < 2) distractors.push(syllable + "X"); 
            return distractors;
        };

                if (eyeMode === 'grid') {

                    return { words: flatList.map((w, i) => ({ id: i, word: "", lineIndex: 0 })), index: -1 };
                } else {
                    const rowCounts = [1, 2, 3, 4, 5]; let idCounter = 0;
                    rowCounts.forEach((count, lineIdx) => {
                        for(let i=0; i<count; i++) flatWords.push({ id: idCounter++, word: "", lineIndex: lineIdx });
                    });
                    return { words: flatWords, index: -1 };
                }

                let flatWords = []; let idCounter = 0;
                lines.forEach((lineWords, lineIdx) => lineWords.forEach(word => flatWords.push({ id: idCounter++, word: word, lineIndex: lineIdx })));

                    wordsInSentence.forEach(word => {
                        flatWords.push({ id: idCounter++, word: word + (word.endsWith('.') ? '' : ''), lineIndex: lineIdx, isLastWord: false });

                    if (flatWords.length > 0) flatWords[flatWords.length - 1].isLastWord = true;
                    if (flatWords.length > 0 && !flatWords[flatWords.length - 1].word.endsWith('.')) flatWords[flatWords.length - 1].word += '.';

                return { words: flatWords, index: idx };

            }
            return { words: [], index: -1 };
        };

            const handleRefresh = () => {
                if (level === 0) setEyeMode(eyeMode === 'grid' ? 'triangle' : 'grid');
                else if (level === 1) setPyramidIndex((pyramidIndex + 1) % PYRAMID_CONTENT.length);
                else if (level === 2) setStoryIndex((storyIndex + 1) % STORIES.length);
                else if (level === 4) setSyllableIndex((syllableIndex + 1) % SYLLABLE_WORDS.length);
                else loadContent();
            };

            const handleSyl1Click = (syl) => {
                if (sylSuccess) return;
                if (syl === sylData.syl1) { setSelectedSyl1(syl); if (selectedSyl2 === sylData.syl2) { setSylSuccess(true); playSound(); } } 
                else { setShakeLeft(true); setTimeout(() => setShakeLeft(false), 500); }
            };

            const handleSyl2Click = (syl) => {
                if (sylSuccess) return;
                if (syl === sylData.syl2) { setSelectedSyl2(syl); if (selectedSyl1 === sylData.syl1) { setSylSuccess(true); playSound(); } } 
                else { setShakeRight(true); setTimeout(() => setShakeRight(false), 500); }
            };

            const handlePoolClick = (charObj) => {
                if (puzzleSuccess) return;
                const emptyIdx = puzzleSlots.findIndex(s => s === null);
                if (emptyIdx !== -1) {
                    const newSlots = [...puzzleSlots]; newSlots[emptyIdx] = charObj; setPuzzleSlots(newSlots);
                    setPuzzleShuffled(prev => prev.map(p => p.id === charObj.id ? { ...p, isPlaced: true } : p));
                }
            };

            const handleSlotClick = (index) => {
                if (puzzleSuccess) return;
                const charObj = puzzleSlots[index];
                if (charObj) {
                    const newSlots = [...puzzleSlots]; newSlots[index] = null; setPuzzleSlots(newSlots);
                    setPuzzleShuffled(prev => prev.map(p => p.id === charObj.id ? { ...p, isPlaced: false } : p));
                }
            };

            React.useEffect(() => {
                if (level === 3 && puzzleSlots.length > 0 && !puzzleSlots.includes(null) && !puzzleSuccess) {
                    if (puzzleSlots.map(s => s.char).join('') === puzzleWord) {
                        setPuzzleSuccess(true); playSound(); setTimeout(initPuzzle, 2000); 
                    } else {
                        setPuzzleShake(true);
                        setTimeout(() => {
                            setPuzzleShake(false); setPuzzleSlots(Array(puzzleWord.length).fill(null));
                            setPuzzleShuffled(prev => prev.map(p => ({ ...p, isPlaced: false })));
                        }, 500);
                    }
                }
            }, [puzzleSlots]);

            React.useEffect(() => { if (view === 'activity') loadContent(); }, [view, level, eyeMode, storyIndex, pyramidIndex, syllableIndex, hecePage]); 

            const initPuzzle = () => {
                const nextIndex = Math.floor(Math.random() * PUZZLE_WORDS.length);
                const word = PUZZLE_WORDS[nextIndex];
                setPuzzleWord(word); setPuzzleShuffled(shuffleWord(word)); setPuzzleSlots(Array(word.length).fill(null)); setPuzzleSuccess(false);
            };

            React.useEffect(() => {
                let currentSpeed = level === 5 ? heceSpeed : speed;
                if (isPlaying && level !== 3 && level !== 4 && view === 'activity') {
                    timerRef.current = setInterval(() => {
                        setCurrentIndex((prev) => {
                            if (prev + 1 >= words.length) {
                                if (lap < maxLaps) { setLap(l => l + 1); return 0; } 
                                else { setIsPlaying(false); clearInterval(timerRef.current); playSound(); return prev; }
                            }
                            return prev + 1;
                        });
                    }, currentSpeed * 1000);
                } else clearInterval(timerRef.current);
                return () => clearInterval(timerRef.current);
            }, [isPlaying, words, speed, heceSpeed, lap, level]);

            React.useEffect(() => {
                if (currentIndex >= 0 && level < 3) {
                    const el = document.getElementById(`word-${currentIndex}`);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
                }
            }, [currentIndex]);

            const handleExitApp = () => { if (window.confirm("Uygulamadan çıkmak istiyor musunuz?")) window.close(); };
            const toggleFocusMode = () => setIsFocusMode(!isFocusMode);

            if (view === 'loading') return <div className="h-full flex items-center justify-center text-4xl text-slate-500 font-['TemelYazi']">Yükleniyor...</div>;

            return (
                <React.Fragment>
                {/* OYUN ANA EKRANI - YAZDIRMA ESNASINDA TAMAMEN GİZLENİR */}
                <div className={`h-full flex-col items-center bg-[#FFFBEB] print-hide ${printData ? 'hidden' : 'flex'}`}>
                    <audio ref={audioRef} src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3" preload="auto" />

                    {/* MENÜ SAYFASI */}
                    {view === 'menu' && (
                        <div className="flex-1 flex flex-col items-center justify-center w-full max-w-7xl p-8 animate-pop-up">
                            <h1 className="text-7xl md:text-9xl font-normal text-[#FF8C42] mb-4 font-['TemelYazi'] tracking-wide drop-shadow-sm">OKUMATİK</h1>
                            <p className="text-slate-500 text-3xl md:text-4xl mb-16 font-['TemelYazi'] font-normal">1. Sınıf Hızlı Okuma Asistanı</p>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8 w-full max-w-6xl">
                                {/* ÜST SIRA */}
                                <button onClick={() => { setLevel(0); setView('activity'); }} className="bg-white p-8 rounded-[3rem] border-8 border-[#FF8C42] shadow-xl hover:scale-105 transition-transform flex flex-col items-center text-center gap-4 group">
                                    <div className="bg-orange-100 p-6 rounded-full text-[#FF8C42]"><Icons.Eye size={64}/></div>
                                    <div><h3 className="text-3xl font-normal text-slate-700 font-['TemelYazi']">Göz Takibi</h3><p className="text-lg text-slate-400 font-['TemelYazi']">Kasları geliştir</p></div>
                                </button>
                                
                                <button onClick={() => { setLevel(5); setView('activity'); }} className="bg-white p-8 rounded-[3rem] border-8 border-pink-400 shadow-xl hover:scale-105 transition-transform flex flex-col items-center text-center gap-4 group">
                                    <div className="bg-pink-100 p-6 rounded-full text-pink-500"><Icons.Book size={64}/></div>
                                    <div><h3 className="text-3xl font-normal text-slate-700 font-['TemelYazi']">Hece Oku</h3><p className="text-lg text-slate-400 font-['TemelYazi']">Hızlı hece takibi</p></div>
                                </button>

                                <button onClick={() => { setLevel(4); setView('activity'); }} className="bg-white p-8 rounded-[3rem] border-8 border-purple-400 shadow-xl hover:scale-105 transition-transform flex flex-col items-center text-center gap-4 group">
                                    <div className="bg-purple-100 p-6 rounded-full text-purple-500"><Icons.Syllable size={64}/></div>
                                    <div><h3 className="text-3xl font-normal text-slate-700 font-['TemelYazi']">Heceden Kelimeye</h3><p className="text-lg text-slate-400 font-['TemelYazi']">Heceleri birleştir</p></div>
                                </button>

                                {/* ALT SIRA */}
                                <button onClick={() => { setLevel(1); setView('activity'); }} className="bg-white p-8 rounded-[3rem] border-8 border-[#0ea5e9] shadow-xl hover:scale-105 transition-transform flex flex-col items-center text-center gap-4 group">
                                    <div className="bg-sky-100 p-6 rounded-full text-[#0ea5e9]"><Icons.Type size={64}/></div>
                                    <div><h3 className="text-3xl font-normal text-slate-700 font-['TemelYazi']">Hızlı Oku</h3><p className="text-lg text-slate-400 font-['TemelYazi']">Piramit okuma</p></div>
                                </button>

                                <button onClick={() => { setLevel(2); setView('activity'); }} className="bg-white p-8 rounded-[3rem] border-8 border-[#10B981] shadow-xl hover:scale-105 transition-transform flex flex-col items-center text-center gap-4 group">
                                    <div className="bg-emerald-100 p-6 rounded-full text-[#10B981]"><Icons.Align size={64}/></div>
                                    <div><h3 className="text-3xl font-normal text-slate-700 font-['TemelYazi']">Metin Oku</h3><p className="text-lg text-slate-400 font-['TemelYazi']">Hikayeleri çalış</p></div>
                                </button>

                                <button onClick={() => { setLevel(3); setView('activity'); }} className="bg-white p-8 rounded-[3rem] border-8 border-[#F59E0B] shadow-xl hover:scale-105 transition-transform flex flex-col items-center text-center gap-4 group">
                                    <div className="bg-amber-100 p-6 rounded-full text-[#F59E0B]"><Icons.Puzzle size={64}/></div>
                                    <div><h3 className="text-3xl font-normal text-slate-700 font-['TemelYazi']">Kelime Bul</h3><p className="text-lg text-slate-400 font-['TemelYazi']">Harfleri birleştir</p></div>
                                </button>
                            </div>

                            <button onClick={handleExitApp} className="mt-20 bg-red-100 text-red-500 px-12 py-6 rounded-3xl font-normal hover:bg-red-200 transition flex items-center gap-4 border-4 border-red-200 text-3xl font-['TemelYazi']">
                                <Icons.Power size={48} /> UYGULAMADAN ÇIK
                            </button>
                        </div>
                    )}

                    {/* AKTİVİTE SAYFASI */}
                    {view === 'activity' && (
                        <div className="w-full h-full flex flex-col relative">
                            {/* ÜST BAR */}
                            {(!isFocusMode || level !== 2) && level !== 4 && (
                                <div className="bg-white shadow-xl p-4 md:p-6 flex justify-between items-center z-50 border-b-4 border-slate-200">
                                    <div className="flex gap-4">
                                        <button onClick={() => { setIsPlaying(false); setView('menu'); }} className="flex items-center gap-3 bg-slate-100 px-6 py-4 rounded-2xl font-normal text-slate-600 hover:bg-slate-200 text-2xl border-2 border-slate-300 font-['TemelYazi']">
                                            <Icons.Home size={32} /> MENÜ
                                        </button>
                                        
                                        {(level === 1 || level === 2) && (
                                            <button onClick={() => handlePrint(level, level === 1 ? pyramidIndex : storyIndex)} className="flex items-center gap-3 bg-blue-100 px-6 py-4 rounded-2xl font-normal text-blue-600 hover:bg-blue-200 text-2xl border-2 border-blue-300 shadow-md transition-colors font-['TemelYazi']">
                                                <Icons.Printer size={32} /> YAZDIR
                                            </button>
                                        )}
                                        
                                        {level === 5 && (
                                            <div className="flex gap-4 bg-slate-100 p-2 rounded-2xl border-2 border-slate-300">
                                                <button onClick={() => { setHecePage(0); setIsPlaying(false); setCurrentIndex(-1); }} className={`px-6 py-2 rounded-xl font-normal transition-all text-xl font-['TemelYazi'] ${hecePage === 0 ? 'bg-pink-500 text-white shadow-md' : 'text-slate-500 hover:bg-white'}`}>1. Sayfa</button>
                                                <button onClick={() => { setHecePage(1); setIsPlaying(false); setCurrentIndex(-1); }} className={`px-6 py-2 rounded-xl font-normal transition-all text-xl font-['TemelYazi'] ${hecePage === 1 ? 'bg-pink-500 text-white shadow-md' : 'text-slate-500 hover:bg-white'}`}>2. Sayfa</button>
                                            </div>
                                        )}
                                    </div>

                                    <div className="flex items-center gap-6">
                                        {level !== 2 && level !== 3 && (
                                            <div className="flex items-center gap-4 bg-slate-100 px-6 py-3 rounded-2xl border-2 border-slate-300">
                                                <span className="text-slate-500 text-xl font-normal font-['TemelYazi']">HIZ:</span>
                                                {level === 5 ? (
                                                    <React.Fragment>
                                                        <input type="range" min="2" max="5" step="1" value={heceSpeed} onChange={(e) => setHeceSpeed(Number(e.target.value))} className="w-40 md:w-64 horizontal-slider" style={{accentColor: '#ec4899'}} />
                                                        <span className="text-slate-700 font-normal w-12 text-2xl text-center font-['TemelYazi']">{heceSpeed}s</span>
                                                    </React.Fragment>
                                                ) : (
                                                    <React.Fragment>
                                                        <input type="range" min="0.5" max="3" step="0.5" value={speed} onChange={(e) => setSpeed(Number(e.target.value))} className="w-40 md:w-64 horizontal-slider" />
                                                        <span className="text-slate-700 font-normal w-12 text-2xl text-center font-['TemelYazi']">{speed}s</span>
                                                    </React.Fragment>
                                                )}
                                            </div>
                                        )}
                                        
                                        {level !== 5 && (
                                            <button onClick={handleRefresh} className="bg-yellow-400 hover:bg-yellow-500 text-white p-4 rounded-2xl shadow-md transition active:scale-95 border-b-4 border-yellow-600">
                                                <Icons.Refresh size={40} />
                                            </button>
                                        )}

                                        {level !== 3 && level !== 2 && (
                                            <button onClick={() => setIsPlaying(!isPlaying)} className={`flex items-center gap-3 px-8 py-4 rounded-2xl font-normal text-white shadow-md transition active:scale-95 text-2xl border-b-4 font-['TemelYazi'] ${isPlaying ? 'bg-red-500 border-red-700' : 'bg-green-500 border-green-700'}`}>
                                                {isPlaying ? <><Icons.Pause size={36}/> DUR</> : <><Icons.Play size={36}/> OKU</>}
                                            </button>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* LEVEL 4 ÖZEL ÜST BAR */}
                            {level === 4 && (
                                <div className="flex justify-between p-6 z-50">
                                    <button onClick={() => { setView('menu'); }} className="flex items-center gap-3 bg-white/80 px-6 py-4 rounded-2xl font-normal text-slate-600 hover:bg-white text-2xl border-4 border-slate-300 font-['TemelYazi']">
                                        <Icons.Home size={32} /> MENÜ
                                    </button>
                                    <button onClick={handleRefresh} className="bg-yellow-400 hover:bg-yellow-500 text-white p-4 rounded-2xl shadow-md transition active:scale-95 border-b-4 border-yellow-600">
                                        <Icons.Refresh size={40} />
                                    </button>
                                </div>
                            )}

                            {/* İÇERİK ALANI */}
                            <div className="flex-1 overflow-hidden flex flex-col items-center justify-center p-4 relative w-full h-full">
                                
                                {level < 3 && !isFocusMode && level !== 4 && (
                                    <div className="absolute bottom-4 right-4 bg-white/80 backdrop-blur px-6 py-3 rounded-xl border-4 border-slate-300 text-slate-600 font-normal text-3xl font-['TemelYazi'] shadow-lg z-20">
                                        Tur: {lap}/{maxLaps}
                                    </div>
                                )}

                                {level === 0 ? (
                                    /* LEVEL 0: GÖZ TAKİBİ */
                                    eyeMode === 'grid' ? (
                                        <div className="grid grid-cols-5 gap-x-24 gap-y-20 m-auto max-w-[95%]">
                                            {words.map((item) => (
                                                <div key={item.id} id={`word-${item.id}`} className={`w-32 h-20 md:w-48 md:h-32 rounded-3xl border-8 transition-all duration-200 ${currentIndex === item.id ? 'bg-yellow-400 border-yellow-600 scale-125 shadow-2xl z-10' : 'bg-white border-slate-300'}`}></div>
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="flex flex-col items-center justify-center gap-12 m-auto max-w-[95%]">
                                            {[0, 1, 2, 3, 4].map(lineIdx => (
                                                <div key={lineIdx} className="flex gap-16">
                                                    {words.filter(w => w.lineIndex === lineIdx).map(item => (
                                                        <div key={item.id} id={`word-${item.id}`} className={`w-32 h-20 md:w-48 md:h-32 rounded-full border-8 transition-all duration-200 ${currentIndex === item.id ? 'bg-yellow-400 border-yellow-600 scale-125 shadow-2xl z-10' : 'bg-white border-slate-300'}`}></div>
                                                    ))}
                                                </div>
                                            ))}
                                        </div>
                                    )
                                ) : level === 5 ? (
                                    /* LEVEL 5: HECE OKU */
                                    <div className="grid grid-cols-3 gap-16 md:gap-24 m-auto">
                                        {words.map((item) => (
                                            <div key={item.id} id={`word-${item.id}`} 
                                                 className={`w-40 h-24 md:w-64 md:h-40 rounded-[2rem] border-[10px] flex items-center justify-center text-6xl md:text-8xl font-['TemelYazi'] font-normal transition-all duration-300 
                                                 ${currentIndex === item.id ? 'bg-yellow-400 border-yellow-600 scale-125 shadow-2xl z-10 text-black' : 'bg-white border-black text-black'}`}>
                                                {item.word}
                                            </div>
                                        ))}
                                    </div>
                                ) : level === 1 ? (
                                    /* LEVEL 1: PİRAMİT */
                                    <div className="h-full flex flex-col justify-between w-full max-w-[95%] py-4 md:py-8">
                                        {[0,1,2,3,4,5,6].map(lineNum => (
                                            <div key={lineNum} className="flex justify-center gap-6">
                                                {words.filter(w => w.lineIndex === lineNum).map(item => (
                                                    <div key={item.id} id={`word-${item.id}`} className={`text-6xl md:text-[5rem] font-['TemelYazi'] px-4 py-0 rounded-2xl transition-all duration-300 border-4 border-transparent leading-none ${currentIndex === item.id ? 'bg-yellow-300 border-yellow-500 scale-110 shadow-2xl text-black font-normal z-10' : 'text-slate-800 font-normal'}`}>
                                                        {item.word}
                                                    </div>
                                                ))}
                                            </div>
                                        ))}
                                    </div>
                                ) : level === 2 ? (
                                    /* LEVEL 2: HİKAYE - DİNAMİK TAM EKRAN FONT BOOTSTER */
                                    <div className={`transition-all duration-500 bg-white shadow-2xl border-8 border-slate-200 mx-auto flex items-center justify-center relative ${isFocusMode ? 'fixed inset-0 z-[100] w-full h-full rounded-none border-0' : 'w-full max-w-[90%] max-h-[85vh] rounded-[3rem] p-8 md:p-12'}`}>
                                        <button onClick={() => setIsPlaying(!isPlaying)} className={`absolute top-6 left-6 z-20 flex items-center gap-2 px-6 py-3 rounded-2xl font-normal text-white shadow-lg transition active:scale-95 text-xl border-b-4 ${isPlaying ? 'bg-red-500 border-red-700' : 'bg-green-500 border-green-700'} font-['TemelYazi']`}>
                                            {isPlaying ? <><Icons.Pause size={32}/> DUR</> : <><Icons.Play size={32}/> OKU</>}
                                        </button>
                                        <button onClick={toggleFocusMode} className="absolute top-6 right-6 z-20 bg-blue-500 hover:bg-blue-600 text-white p-3 rounded-xl shadow-lg transition active:scale-95 border-b-4 border-blue-700">
                                            {isFocusMode ? <Icons.Minimize size={32}/> : <Icons.Maximize size={32}/>}
                                        </button>
                                        <div className="absolute right-6 top-1/2 -translate-y-1/2 z-20 flex flex-col items-center gap-2 bg-slate-100 p-2 rounded-full border-2 border-slate-300 shadow-inner h-64 w-16 justify-center">
                                            <div className="font-normal text-slate-500 text-sm font-['TemelYazi']">HIZ</div>
                                            <div className="h-48 w-full flex items-center justify-center relative"><input type="range" min="0.5" max="3" step="0.5" value={speed} onChange={(e) => setSpeed(Number(e.target.value))} className="vertical-slider" /></div>
                                            <div className="font-normal text-slate-700 text-lg font-['TemelYazi']">{speed}s</div>
                                        </div>
                                        <div className={`w-full text-center overflow-y-auto flex flex-col justify-center ${isFocusMode ? 'h-screen px-16 md:px-40 py-24' : 'max-h-[75vh] px-12'}`}>
                                            {(() => {
                                                const lines = []; let currentLine = [];
                                                words.forEach(word => { currentLine.push(word); if (word.isLastWord) { lines.push(currentLine); currentLine = []; } });
                                                if(currentLine.length > 0) lines.push(currentLine);
                                                return lines.map((lineWords, lineIdx) => (
                                                    <div key={lineIdx} className={`text-balance leading-tight ${isFocusMode ? 'mb-12 text-[4rem] md:text-[6rem] lg:text-[7.5rem]' : 'mb-8 text-5xl md:text-[4rem]'}`}>
                                                        {lineWords.map(item => (
                                                            <span key={item.id} id={`word-${item.id}`} className={`inline-block font-['TemelYazi'] px-3 py-1 rounded-2xl transition-colors duration-200 border-4 border-transparent mx-1 font-normal ${currentIndex === item.id ? 'bg-yellow-300 border-yellow-500 text-black shadow-xl transform scale-105' : 'text-slate-900'}`}>{item.word}</span>
                                                        ))}
                                                    </div>
                                                ));
                                            })()}
                                        </div>
                                    </div>
                                ) : level === 3 ? (
                                    /* LEVEL 3: PUZZLE */
                                    <div className={`flex flex-col items-center justify-center h-full gap-20 w-full max-w-[90%] transition-transform ${puzzleShake ? 'animate-shake' : ''}`}>
                                        <div className="flex flex-wrap justify-center gap-8">
                                            {puzzleShuffled.map(charObj => (
                                                <div key={charObj.id} onClick={() => !charObj.isPlaced && handlePoolClick(charObj)} className={`w-32 h-32 md:w-40 md:h-40 rounded-[2rem] flex items-center justify-center text-7xl md:text-8xl font-normal font-['TemelYazi'] leading-none pb-2 cursor-pointer border-b-[12px] transition-all active:translate-y-2 active:border-b-0 ${charObj.isPlaced ? 'opacity-0 pointer-events-none' : 'bg-yellow-400 border-yellow-600 text-black shadow-2xl hover:bg-yellow-300'}`}>{charObj.char}</div>
                                            ))}
                                        </div>
                                        <div className="flex flex-wrap justify-center gap-8 bg-white p-12 rounded-[4rem] border-[12px] border-slate-200 shadow-xl">
                                            {puzzleSlots.map((charObj, idx) => (
                                                <div key={idx} onClick={() => handleSlotClick(idx)} className={`w-32 h-32 md:w-40 md:h-40 rounded-[2rem] flex items-center justify-center text-7xl md:text-8xl font-normal font-['TemelYazi'] leading-none pb-2 cursor-pointer border-8 transition-all ${charObj ? (puzzleSuccess ? 'bg-green-500 border-green-600 text-white scale-110 shadow-2xl' : 'bg-white border-slate-300 text-black shadow-md') : 'bg-slate-50 border-slate-300'}`}>{charObj ? charObj.char : ''}</div>
                                            ))}
                                        </div>
                                        {puzzleSuccess && <div className="text-[10rem] font-normal text-green-500 animate-pop-rotate drop-shadow-2xl font-['TemelYazi'] mt-8">HARİKA!</div>}
                                    </div>
                                ) : level === 4 ? (
                                    /* LEVEL 4: HECEDEN KELİMEYE */
                                    sylData && (
                                        <div className="flex flex-col items-center justify-center h-full w-full max-w-[90%] gap-12">
                                            <div className="flex justify-center items-center gap-12 w-full">
                                                <div className="flex gap-6">
                                                    {sylData.options1.map((s, i) => ( <button key={i} onClick={() => handleSyl1Click(s)} className={`w-56 h-36 rounded-[2rem] text-[5rem] font-['TemelYazi'] font-normal border-b-[10px] transition-all active:translate-y-2 active:border-b-0 shadow-xl ${selectedSyl1 === s ? 'bg-blue-500 text-white border-blue-700' : 'bg-blue-100 text-black border-blue-300 hover:bg-blue-200'}`}>{s}</button> ))}
                                                </div>
                                                <div className="w-2 h-48 bg-slate-300 rounded-full opacity-50"></div>
                                                <div className="flex gap-6">
                                                    {sylData.options2.map((s, i) => ( <button key={i} onClick={() => handleSyl2Click(s)} className={`w-56 h-36 rounded-[2rem] text-[5rem] font-['TemelYazi'] font-normal border-b-[10px] transition-all active:translate-y-2 active:border-b-0 shadow-xl ${selectedSyl2 === s ? 'bg-rose-500 text-white border-rose-700' : 'bg-rose-100 text-black border-rose-300 hover:bg-rose-200'}`}>{s}</button> ))}
                                                </div>
                                            </div>
                                            <div className="flex flex-col items-center gap-8 mt-8 w-full">
                                                <div className="flex gap-8">
                                                    <div className={`w-56 h-36 rounded-[2rem] border-8 flex items-center justify-center text-[5rem] font-['TemelYazi'] font-normal bg-white relative transition-all duration-300 ${shakeLeft ? 'animate-shake border-red-400' : (selectedSyl1 ? 'border-blue-500 text-black' : 'border-slate-200 text-slate-300')}`}>{selectedSyl1 || "?"}</div>
                                                    <div className={`w-56 h-36 rounded-[2rem] border-8 flex items-center justify-center text-[5rem] font-['TemelYazi'] font-normal bg-white relative transition-all duration-300 ${shakeRight ? 'animate-shake border-red-400' : (selectedSyl2 ? 'border-rose-500 text-black' : 'border-slate-200 text-slate-300')}`}>{selectedSyl2 || "?"}</div>
                                                </div>
                                                <div className={`transition-all duration-500 flex items-center justify-center gap-8 mt-4 border-8 rounded-[3rem] px-20 py-8 shadow-2xl min-w-[60%] min-h-[180px] ${sylSuccess ? 'bg-green-400 border-green-600 animate-pop-up' : 'bg-slate-100 border-slate-200'}`}>
                                                    {sylSuccess && <div className="text-white text-[11rem] font-normal font-['TemelYazi'] tracking-wider">{sylData.target}</div>}
                                                </div>
                                            </div>
                                        </div>
                                    )
                                ) : null}
                            </div>
                        </div>
                    )}
                    
                    {/* MARKA İMZASI */}
                    <div className="fixed bottom-4 left-4 z-[9999] pointer-events-none select-none opacity-40 hover:opacity-100 transition-opacity duration-500 flex flex-col items-start gap-1">
                        <span className="text-slate-400 font-normal text-lg md:text-xl font-['TemelYazi'] tracking-widest drop-shadow-sm leading-none">
                            Okulmatik<span className="text-slate-500 font-normal">Studio</span>
                        </span>
                        {expiryDateDisp && (
                            <span className="text-slate-400 text-[10px] md:text-xs font-['TemelYazi'] leading-none pl-0.5">
                                Lisans Bitiş: {expiryDateDisp}
                            </span>
                        )}
                    </div>
                </div>

                {/* YAZDIRMA (PRINT) EKRANI */}
                {printData && (
                    <div className="print-show hidden bg-white text-black font-['TemelYazi']">
                        {printData.level === 1 ? (() => {
                            const setData = PYRAMID_CONTENT[printData.idx % PYRAMID_CONTENT.length]; 
                            const lines = [ [setData.s], [setData.s, setData.v], [setData.s, setData.o, setData.v], [setData.s, setData.a, setData.o, setData.v], [setData.s, setData.o, setData.v], [setData.s, setData.v], [setData.s] ];
                            return (
                                <div className="flex flex-col items-center w-full h-[267mm]">
                                    <div className="w-full flex justify-between items-end border-b-[3px] border-slate-300 pb-4 opacity-50 shrink-0">
                                        <h2 className="text-4xl text-slate-600 font-normal">Okuma Çalışmaları</h2>
                                        <span className="text-2xl text-slate-500 font-normal tracking-widest">OKULMATİK</span>
                                    </div>
                                    <div className="flex flex-col items-center justify-evenly flex-1 w-full py-10">
                                        {lines.map((line, i) => (
                                            <div key={i} className="text-[5.5rem] leading-[1.5] text-black font-normal text-center w-full">{line.join(' ')}</div>
                                        ))}
                                    </div>
                                </div>
                            );
                        })() : (() => {
                            const story = STORIES[printData.idx % STORIES.length];
                            const sentences = story.split('. ').filter(s => s.trim().length > 0);
                            return (
                                <div className="flex flex-col w-full h-[267mm]">
                                    <div className="w-full flex justify-between items-end border-b-[3px] border-slate-300 pb-4 mb-12 opacity-50 shrink-0">
                                        <h2 className="text-4xl text-slate-600 font-normal">Okuma Çalışmaları</h2>
                                        <span className="text-2xl text-slate-500 font-normal tracking-widest">OKULMATİK</span>
                                    </div>
                                    <div className="flex flex-col flex-1 w-full justify-evenly pl-8">
                                        {sentences.map((sentence, i) => (
                                            <div key={i} className="text-[4rem] leading-tight text-black font-normal w-full text-left">
                                                {sentence.trim() + (sentence.endsWith('.') ? '' : '.')}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            );
                        })()}
                    </div>
                )}
                </React.Fragment>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ReadingApp />);
    </script>
</body>
</html>
