<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1. Sınıf Hızlı Okuma Asistanı</title>
    
    <!-- TARAYICI SEKMESİ İKONU -->
    <link rel="icon" type="image/png" href="assets/icon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @font-face {
            font-family: 'TemelYazi';
            src: url('assets/Temelyazi.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        body { 
            font-family: 'TemelYazi', 'Segoe UI', sans-serif; 
            background-color: #FFFBEB;
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;
            cursor: default;
        }

        .temel-yazi-font { font-family: 'TemelYazi', sans-serif; font-weight: normal; }
        .text-balance { text-wrap: balance; }

        @keyframes popUpIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .animate-pop-up { animation: popUpIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
        .animate-shake { animation: shake 0.3s ease-in-out; }
        @keyframes popRotate { 0% { transform: scale(0) rotate(-180deg); opacity: 0; } 60% { transform: scale(1.1) rotate(10deg); opacity: 1; } 100% { transform: scale(1) rotate(0deg); } }
        .animate-pop-rotate { animation: popRotate 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards; }

        input[type=range].horizontal-slider { accent-color: #FF8C42; height: 16px; cursor: pointer; }

        @media print {
            @page { size: A4 portrait; margin: 0; }
            html, body { 
                background-color: white !important; 
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
                width: 210mm !important;
                height: 297mm !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .print-hide { display: none !important; }
            .print-show { 
                display: block !important; 
                width: 210mm !important;
                height: 297mm !important;
                background: white;
                box-sizing: border-box;
                padding: 15mm;
            }
        }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;" class="h-[100dvh] w-screen overflow-hidden relative">

    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const Icons = {
            Play: ({ size = 26 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>,
            Pause: ({ size = 26 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>,
            Refresh: ({ size = 26 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg>,
            Home: ({ size = 26 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>,
            Eye: ({ size = 44 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>,
            Type: ({ size = 44 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>,
            Align: ({ size = 44 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><line x1="17" y1="10" x2="3" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="17" y1="18" x2="3" y2="18"></line></svg>,
            Puzzle: ({ size = 44 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect></svg>,
            Syllable: ({ size = 44 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M7 4v16M17 4v16M3 8h4M3 16h4M17 8h4M17 16h4M7 12h10"></path></svg>,
            Printer: ({ size = 26 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>,
            Book: ({ size = 44 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        };

        const PYRAMID_CONTENT = [
            { s: "Ali", v: "açtı", o: "kitabı", a: "kalın" }, { s: "Ece", v: "yazdı", o: "yazıyı", a: "güzel" }, { s: "Can", v: "çizdi", o: "resmi", a: "renkli" }, { s: "Mert", v: "sildi", o: "tahtayı", a: "temiz" }, { s: "Ela", v: "okudu", o: "masalı", a: "uzun" }, { s: "Nil", v: "açtı", o: "defteri", a: "kareli" }, { s: "Emre", v: "buldu", o: "kalemi", a: "kırmızı" }, { s: "Ada", v: "kesti", o: "kağıdı", a: "beyaz" }, { s: "Cem", v: "astı", o: "panoyu", a: "büyük" }, { s: "Oya", v: "tuttu", o: "cetveli", a: "sarı" },
            { s: "Annem", v: "yaptı", o: "keki", a: "tatlı" }, { s: "Babam", v: "yıkadı", o: "arabayı", a: "kirli" }, { s: "Dedem", v: "taktı", o: "gözlüğü", a: "yeni" }, { s: "Ninem", v: "ördü", o: "atkıyı", a: "yünlü" }, { s: "Ablam", v: "sildi", o: "camı", a: "tozlu" }, { s: "Abim", v: "topladı", o: "odayı", a: "dağınık" }, { s: "Teyzem", v: "pişirdi", o: "böreği", a: "sıcak" }, { s: "Dayım", v: "tamir etti", o: "kapıyı", a: "eski" }, { s: "Halam", v: "demledi", o: "çayı", a: "taze" }, { s: "Kardeşim", v: "içti", o: "sütü", a: "ılık" }
        ];

        const STORIES = [
            "Ali bahçede top oynadı. Topu hızla Efe'ye attı. Efe topu havada tuttu. İkisi de çok eğlendiler. Akşam olunca evlerine döndüler.",
            "Ayşe sabah neşeyle okula gitti. Çantasından renkli kalemini çıkardı. Kağıda kocaman bir ev çizdi. Yaptığı resmi öğretmenine gösterdi. Öğretmeni ona yıldız verdi.",
            "Bugün hava güneşli ve sıcak. Ağaçtaki kuşlar şarkı söylüyor. Biz ailecek parka gittik. Salıncakta neşeyle sallandık. Kaydıraktan kayıp çok eğlendik.",
            "Annem mutfakta nefis bir kek yaptı. Kek fırından çıkınca mis gibi koktu. Hepimiz sofraya oturup yedik. Eline sağlık güzel annem.",
            "Babam işten eve geldi. Bana resimli bir kitap aldı. Kitabı hemen okumaya başladım. İçindeki resimler çok güzeldi. Okumayı çok seviyorum."
        ];

        const PUZZLE_WORDS = [
            "BAL", "SÜT", "MUZ", "KUŞ", "AYI", "ÇAY", "GÜL", "TOP", "KEK", "YOL",
            "KEDİ", "FARE", "KUZU", "İNEK", "KEÇİ", "DEVE", "KUĞU", "OKUL", "SIRA", "MASA"
        ];

        const SYLLABLE_WORDS = [
             {w:"KE-Dİ"}, {w:"KÖ-PEK"}, {w:"TA-VUK"}, {w:"KU-ZU"}, {w:"CİV-CİV"}, {w:"BA-LIK"}, {w:"ÖR-DEK"}, {w:"AS-LAN"}, {w:"PAN-DA"}, {w:"ZEB-RA"}
        ];

        const HECE_OKU_PAGES = [
            ["an", "en", "in", "at", "et", "it", "al", "el", "il"],
            ["na", "ne", "ni", "ta", "te", "ti", "la", "le", "li"]
        ];

        const shuffleWord = (word) => {
            let chars = word.split('').map((char, index) => ({ id: index, char, isPlaced: false }));
            if (word.length > 1) {
                let attempts = 0; let isSame = true;
                while (isSame && attempts < 20) { 
                    for (let i = chars.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [chars[i], chars[j]] = [chars[j], chars[i]];
                    }
                    if (chars.map(c => c.char).join('') !== word) isSame = false;
                    attempts++;
                }
            }
            return chars;
        };

        const generateDistractors = (syllable) => {
            const vowels = ['a', 'e', 'ı', 'i', 'o', 'ö', 'u', 'ü'];
            const upperSyllable = syllable.toLocaleLowerCase('tr');
            let vowelIndex = -1;
            for (let i = 0; i < upperSyllable.length; i++) {
                if (vowels.includes(upperSyllable[i])) { vowelIndex = i; break; }
            }
            if (vowelIndex === -1) return [syllable, syllable]; 
            const originalVowel = upperSyllable[vowelIndex];
            const distractors = [];
            for (let v of vowels) {
                if (v === originalVowel) continue; 
                const newSyllable = (upperSyllable.substring(0, vowelIndex) + v + upperSyllable.substring(vowelIndex + 1)).toLocaleUpperCase('tr');
                distractors.push(newSyllable);
                if (distractors.length === 2) break; 
            }
            while (distractors.length < 2) distractors.push(syllable + "X"); 
            return distractors;
        };

        const generateText = (currentLevel, eyeMode, idx = 0) => {
            if (currentLevel === 0) {
                let flatWords = [];
                if (eyeMode === 'grid') {
                    let flatList = Array(20).fill("");
                    return { words: flatList.map((w, i) => ({ id: i, word: "", lineIndex: 0 })), index: -1 };
                } else {
                    const rowCounts = [1, 2, 3, 4, 5]; let idCounter = 0;
                    rowCounts.forEach((count, lineIdx) => {
                        for(let i=0; i<count; i++) flatWords.push({ id: idCounter++, word: "", lineIndex: lineIdx });
                    });
                    return { words: flatWords, index: -1 };
                }
            } 
            else if (currentLevel === 1) {
                const setData = PYRAMID_CONTENT[idx % PYRAMID_CONTENT.length]; 
                const lines = [ [setData.s], [setData.s, setData.v], [setData.s, setData.o, setData.v], [setData.s, setData.a, setData.o, setData.v], [setData.s, setData.o, setData.v], [setData.s, setData.v], [setData.s] ];
                let flatWords = []; let idCounter = 0;
                lines.forEach((lineWords, lineIdx) => lineWords.forEach(word => flatWords.push({ id: idCounter++, word: word, lineIndex: lineIdx })));
                return { words: flatWords, index: idx };
            }
            else if (currentLevel === 2) {
                let story = STORIES[idx % STORIES.length]; 
                const sentences = story.split('. ').filter(s => s.trim().length > 0);
                let flatWords = []; let idCounter = 0;
                sentences.forEach((sentence, lineIdx) => {
                    const wordsInSentence = sentence.trim().split(/\s+/);
                    wordsInSentence.forEach(word => {
                        flatWords.push({ id: idCounter++, word: word + (word.endsWith('.') ? '' : ''), lineIndex: lineIdx, isLastWord: false });
                    });
                    if (flatWords.length > 0) flatWords[flatWords.length - 1].isLastWord = true;
                    if (flatWords.length > 0 && !flatWords[flatWords.length - 1].word.endsWith('.')) flatWords[flatWords.length - 1].word += '.';
                });
                return { words: flatWords, index: idx };
            }
            else if (currentLevel === 4) {
                 const wordData = SYLLABLE_WORDS[idx % SYLLABLE_WORDS.length];
                 const parts = wordData.w.split('-');
                 const d1 = generateDistractors(parts[0]); const d2 = generateDistractors(parts[1]);
                 return { target: wordData.w.replace('-', ''), syl1: parts[0], syl2: parts[1], options1: [parts[0], ...d1].sort(()=>Math.random()-0.5), options2: [parts[1], ...d2].sort(()=>Math.random()-0.5), index: idx };
            }
            return { words: [], index: -1 };
        };

        const ReadingApp = () => {
            const [view, setView] = React.useState('menu');
            const [level, setLevel] = React.useState(0);
            const [words, setWords] = React.useState([]);
            const [currentIndex, setCurrentIndex] = React.useState(-1);
            const [isPlaying, setIsPlaying] = React.useState(false);
            const [speed, setSpeed] = React.useState(2);
            
            const [hecePage, setHecePage] = React.useState(0);
            const [heceSpeed, setHeceSpeed] = React.useState(2);

            const [storyIndex, setStoryIndex] = React.useState(0);
            const [pyramidIndex, setPyramidIndex] = React.useState(0);
            const [syllableIndex, setSyllableIndex] = React.useState(0);
            
            const [eyeMode, setEyeMode] = React.useState('grid'); 
            const [lap, setLap] = React.useState(1); 
            const [maxLaps, setMaxLaps] = React.useState(2); 

            const [puzzleWord, setPuzzleWord] = React.useState("");
            const [puzzleShuffled, setPuzzleShuffled] = React.useState([]);
            const [puzzleSlots, setPuzzleSlots] = React.useState([]);
            const [puzzleSuccess, setPuzzleSuccess] = React.useState(false);
            const [puzzleShake, setPuzzleShake] = React.useState(false);

            const [sylData, setSylData] = React.useState(null);
            const [selectedSyl1, setSelectedSyl1] = React.useState(null);
            const [selectedSyl2, setSelectedSyl2] = React.useState(null);
            const [sylSuccess, setSylSuccess] = React.useState(false);
            const [shakeLeft, setShakeLeft] = React.useState(false);
            const [shakeRight, setShakeRight] = React.useState(false);

            const [printData, setPrintData] = React.useState(null);

            const timerRef = React.useRef(null);
            const audioRef = React.useRef(null);

            React.useEffect(() => {
                if (printData !== null) {
                    const timer = setTimeout(() => {
                        window.print();
                        setTimeout(() => setPrintData(null), 500);
                    }, 500);
                    return () => clearTimeout(timer);
                }
            }, [printData]);

            const handlePrint = (levelToPrint, idx) => setPrintData({ level: levelToPrint, idx: idx });

            const playSound = () => { 
                if(audioRef.current) { 
                    audioRef.current.currentTime = 0; 
                    audioRef.current.play().catch(e=>{}); 
                } 
            };

            const loadContent = () => {
                setIsPlaying(false); setCurrentIndex(-1); setLap(1); clearInterval(timerRef.current);
                if (level === 0) setWords(generateText(0, eyeMode).words);
                else if (level === 1) setWords(generateText(1, null, pyramidIndex).words);
                else if (level === 2) setWords(generateText(2, null, storyIndex).words);
                else if (level === 3) initPuzzle();
                else if (level === 4) {
                    setSylData(generateText(4, null, syllableIndex));
                    setSelectedSyl1(null); setSelectedSyl2(null); setSylSuccess(false);
                }
                else if (level === 5) {
                    const pageWords = HECE_OKU_PAGES[hecePage].map((w, i) => ({ id: i, word: w }));
                    setWords(pageWords);
                }
            };

            const handleRefresh = () => {
                if (level === 0) setEyeMode(eyeMode === 'grid' ? 'triangle' : 'grid');
                else if (level === 1) setPyramidIndex((pyramidIndex + 1) % PYRAMID_CONTENT.length);
                else if (level === 2) setStoryIndex((storyIndex + 1) % STORIES.length);
                else if (level === 4) setSyllableIndex((syllableIndex + 1) % SYLLABLE_WORDS.length);
                else loadContent();
            };

            const handleSyl1Click = (syl) => {
                if (sylSuccess) return;
                if (syl === sylData.syl1) { 
                    setSelectedSyl1(syl); 
                    if (selectedSyl2 === sylData.syl2) { setSylSuccess(true); playSound(); } 
                } else { 
                    setShakeLeft(true); setTimeout(() => setShakeLeft(false), 500); 
                }
            };

            const handleSyl2Click = (syl) => {
                if (sylSuccess) return;
                if (syl === sylData.syl2) { 
                    setSelectedSyl2(syl); 
                    if (selectedSyl1 === sylData.syl1) { setSylSuccess(true); playSound(); } 
                } else { 
                    setShakeRight(true); setTimeout(() => setShakeRight(false), 500); 
                }
            };

            const handlePoolClick = (charObj) => {
                if (puzzleSuccess) return;
                const emptyIdx = puzzleSlots.findIndex(s => s === null);
                if (emptyIdx !== -1) {
                    const newSlots = [...puzzleSlots]; newSlots[emptyIdx] = charObj; setPuzzleSlots(newSlots);
                    setPuzzleShuffled(prev => prev.map(p => p.id === charObj.id ? { ...p, isPlaced: true } : p));
                }
            };

            const handleSlotClick = (index) => {
                if (puzzleSuccess) return;
                const charObj = puzzleSlots[index];
                if (charObj) {
                    const newSlots = [...puzzleSlots]; newSlots[index] = null; setPuzzleSlots(newSlots);
                    setPuzzleShuffled(prev => prev.map(p => p.id === charObj.id ? { ...p, isPlaced: false } : p));
                }
            };

            React.useEffect(() => {
                if (level === 3 && puzzleSlots.length > 0 && !puzzleSlots.includes(null) && !puzzleSuccess) {
                    if (puzzleSlots.map(s => s.char).join('') === puzzleWord) {
                        setPuzzleSuccess(true); playSound(); setTimeout(initPuzzle, 2000); 
                    } else {
                        setPuzzleShake(true);
                        setTimeout(() => {
                            setPuzzleShake(false); setPuzzleSlots(Array(puzzleWord.length).fill(null));
                            setPuzzleShuffled(prev => prev.map(p => ({ ...p, isPlaced: false })));
                        }, 500);
                    }
                }
            }, [puzzleSlots]);

            React.useEffect(() => { if (view === 'activity') loadContent(); }, [view, level, eyeMode, storyIndex, pyramidIndex, syllableIndex, hecePage]); 

            const initPuzzle = () => {
                const nextIndex = Math.floor(Math.random() * PUZZLE_WORDS.length);
                const word = PUZZLE_WORDS[nextIndex];
                setPuzzleWord(word); setPuzzleShuffled(shuffleWord(word)); setPuzzleSlots(Array(word.length).fill(null)); setPuzzleSuccess(false);
            };

            React.useEffect(() => {
                let currentSpeed = level === 5 ? heceSpeed : speed;
                if (isPlaying && level !== 3 && level !== 4 && view === 'activity') {
                    timerRef.current = setInterval(() => {
                        setCurrentIndex((prev) => {
                            if (prev + 1 >= words.length) {
                                if (lap < maxLaps) { setLap(l => l + 1); return 0; } 
                                else { setIsPlaying(false); clearInterval(timerRef.current); playSound(); return prev; }
                            }
                            return prev + 1;
                        });
                    }, currentSpeed * 1000);
                } else clearInterval(timerRef.current);
                return () => clearInterval(timerRef.current);
            }, [isPlaying, words, speed, heceSpeed, lap, level]);

            return (
                <React.Fragment>
                <div className={`h-full flex-col items-center bg-[#FFFBEB] print-hide overflow-hidden ${printData ? 'hidden' : 'flex'}`}>
                    <audio ref={audioRef} src="assets/ses.mp3" preload="auto" />

                    {/* MENÜ SAYFASI */}
                    {view === 'menu' && (
                        <div className="flex-1 overflow-y-auto w-full flex flex-col items-center p-4 md:p-8 animate-pop-up">
                            <h1 className="text-5xl md:text-8xl font-normal text-[#FF8C42] mt-4 mb-2 tracking-wide drop-shadow-sm text-center">OKUMATİK</h1>
                            <p className="text-slate-500 text-xl md:text-3xl mb-8 md:mb-12 font-normal text-center">1. Sınıf Hızlı Okuma Asistanı</p>

                            <div className="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-8 w-full max-w-5xl mb-8">
                                <button onClick={() => { setLevel(0); setView('activity'); }} className="bg-white p-4 md:p-8 rounded-3xl md:rounded-[3rem] border-4 md:border-8 border-[#FF8C42] shadow-lg hover:scale-105 transition-transform flex flex-col items-center text-center gap-2 md:gap-4">
                                    <div className="bg-orange-100 p-3 md:p-5 rounded-full text-[#FF8C42]"><Icons.Eye size={36}/></div>
                                    <div><h3 className="text-xl md:text-3xl font-normal text-slate-700">Göz Takibi</h3><p className="hidden md:block text-slate-400">Kasları geliştir</p></div>
                                </button>
                                
                                <button onClick={() => { setLevel(5); setView('activity'); }} className="bg-white p-4 md:p-8 rounded-3xl md:rounded-[3rem] border-4 md:border-8 border-pink-400 shadow-lg hover:scale-105 transition-transform flex flex-col items-center text-center gap-2 md:gap-4">
                                    <div className="bg-pink-100 p-3 md:p-5 rounded-full text-pink-500"><Icons.Book size={36}/></div>
                                    <div><h3 className="text-xl md:text-3xl font-normal text-slate-700">Hece Oku</h3><p className="hidden md:block text-slate-400">Hızlı hece takibi</p></div>
                                </button>

                                <button onClick={() => { setLevel(4); setView('activity'); }} className="bg-white p-4 md:p-8 rounded-3xl md:rounded-[3rem] border-4 md:border-8 border-purple-400 shadow-lg hover:scale-105 transition-transform flex flex-col items-center text-center gap-2 md:gap-4">
                                    <div className="bg-purple-100 p-3 md:p-5 rounded-full text-purple-500"><Icons.Syllable size={36}/></div>
                                    <div><h3 className="text-xl md:text-3xl font-normal text-slate-700">Heceden Kelimeye</h3><p className="hidden md:block text-slate-400">Heceleri birleştir</p></div>
                                </button>

                                <button onClick={() => { setLevel(1); setView('activity'); }} className="bg-white p-4 md:p-8 rounded-3xl md:rounded-[3rem] border-4 md:border-8 border-[#0ea5e9] shadow-lg hover:scale-105 transition-transform flex flex-col items-center text-center gap-2 md:gap-4">
                                    <div className="bg-sky-100 p-3 md:p-5 rounded-full text-[#0ea5e9]"><Icons.Type size={36}/></div>
                                    <div><h3 className="text-xl md:text-3xl font-normal text-slate-700">Hızlı Oku</h3><p className="hidden md:block text-slate-400">Piramit okuma</p></div>
                                </button>

                                <button onClick={() => { setLevel(2); setView('activity'); }} className="bg-white p-4 md:p-8 rounded-3xl md:rounded-[3rem] border-4 md:border-8 border-[#10B981] shadow-lg hover:scale-105 transition-transform flex flex-col items-center text-center gap-2 md:gap-4">
                                    <div className="bg-emerald-100 p-3 md:p-5 rounded-full text-[#10B981]"><Icons.Align size={36}/></div>
                                    <div><h3 className="text-xl md:text-3xl font-normal text-slate-700">Metin Oku</h3><p className="hidden md:block text-slate-400">Hikayeleri çalış</p></div>
                                </button>

                                <button onClick={() => { setLevel(3); setView('activity'); }} className="bg-white p-4 md:p-8 rounded-3xl md:rounded-[3rem] border-4 md:border-8 border-[#F59E0B] shadow-lg hover:scale-105 transition-transform flex flex-col items-center text-center gap-2 md:gap-4">
                                    <div className="bg-amber-100 p-3 md:p-5 rounded-full text-[#F59E0B]"><Icons.Puzzle size={36}/></div>
                                    <div><h3 className="text-xl md:text-3xl font-normal text-slate-700">Kelime Bul</h3><p className="hidden md:block text-slate-400">Harfleri birleştir</p></div>
                                </button>
                            </div>
                        </div>
                    )}

                    {/* AKTİVİTE SAYFASI */}
                    {view === 'activity' && (
                        <div className="w-full h-full flex flex-col relative overflow-hidden">
                            {/* TEK VE BİRLEŞTİRİLMİŞ ÜST KONTROL BARI */}
                            <div className="bg-white shadow-md px-3 py-2 md:px-6 md:py-3 flex justify-between items-center z-50 border-b-2 md:border-b-4 border-slate-200 gap-2 shrink-0">
                                {/* SOL GURUP: MENÜ, YAZDIR, SAYFA SEÇİMİ */}
                                <div className="flex items-center gap-2">
                                    <button onClick={() => { setIsPlaying(false); setView('menu'); }} className="flex items-center gap-1.5 bg-slate-100 px-3 py-2 rounded-xl text-slate-700 text-sm md:text-xl border border-slate-300 active:scale-95 transition">
                                        <Icons.Home size={20} /> <span className="hidden sm:inline">MENÜ</span>
                                    </button>
                                    
                                    {(level === 1 || level === 2) && (
                                        <button onClick={() => handlePrint(level, level === 1 ? pyramidIndex : storyIndex)} className="flex items-center gap-1.5 bg-blue-100 px-3 py-2 rounded-xl text-blue-600 text-sm md:text-xl border border-blue-300 active:scale-95 transition">
                                            <Icons.Printer size={20} /> <span className="hidden sm:inline">YAZDIR</span>
                                        </button>
                                    )}
                                    
                                    {level === 5 && (
                                        <div className="flex bg-slate-100 p-1 rounded-xl border border-slate-300 gap-1">
                                            <button onClick={() => { setHecePage(0); setIsPlaying(false); setCurrentIndex(-1); }} className={`px-2 py-1 rounded-lg text-xs md:text-base ${hecePage === 0 ? 'bg-pink-500 text-white font-normal' : 'text-slate-600'}`}>1. Sayfa</button>
                                            <button onClick={() => { setHecePage(1); setIsPlaying(false); setCurrentIndex(-1); }} className={`px-2 py-1 rounded-lg text-xs md:text-base ${hecePage === 1 ? 'bg-pink-500 text-white font-normal' : 'text-slate-600'}`}>2. Sayfa</button>
                                        </div>
                                    )}
                                </div>

                                {/* SAĞ GRUP: HIZ, YENİLE, OKU/DUR */}
                                <div className="flex items-center gap-2 sm:gap-4">
                                    {level !== 3 && level !== 4 && (
                                        <div className="flex items-center gap-1.5 sm:gap-2 bg-slate-100 px-2.5 py-1.5 md:px-4 md:py-2 rounded-xl border border-slate-300">
                                            <span className="text-slate-500 text-xs md:text-sm font-normal">HIZ:</span>
                                            {level === 5 ? (
                                                <input type="range" min="2" max="5" step="1" value={heceSpeed} onChange={(e) => setHeceSpeed(Number(e.target.value))} className="w-16 sm:w-28 md:w-36 horizontal-slider" style={{accentColor: '#ec4899'}} />
                                            ) : (
                                                <input type="range" min="0.5" max="3" step="0.5" value={speed} onChange={(e) => setSpeed(Number(e.target.value))} className="w-16 sm:w-28 md:w-36 horizontal-slider" />
                                            )}
                                            <span className="text-slate-700 text-xs md:text-sm w-6 text-center font-normal">{level === 5 ? heceSpeed : speed}s</span>
                                        </div>
                                    )}
                                    
                                    {level !== 5 && (
                                        <button onClick={handleRefresh} className="bg-yellow-400 hover:bg-yellow-500 text-white p-2 md:p-2.5 rounded-xl border-b-2 border-yellow-600 active:scale-95 transition shadow-sm">
                                            <Icons.Refresh size={20} />
                                        </button>
                                    )}

                                    {level !== 3 && level !== 4 && (
                                        <button onClick={() => setIsPlaying(!isPlaying)} className={`flex items-center gap-1.5 px-3 py-1.5 md:px-5 md:py-2 rounded-xl text-white text-sm md:text-lg border-b-2 active:scale-95 transition shadow-sm ${isPlaying ? 'bg-red-500 border-red-700' : 'bg-green-500 border-green-700'}`}>
                                            {isPlaying ? <><Icons.Pause size={20}/> DUR</> : <><Icons.Play size={20}/> OKU</>}
                                        </button>
                                    )}
                                </div>
                            </div>

                            {/* İÇERİK ALANI */}
                            <div className="flex-1 overflow-hidden flex flex-col items-center justify-center p-2 sm:p-4 md:p-8 relative w-full h-full">
                                
                                {level === 0 && (
                                    eyeMode === 'grid' ? (
                                        <div className="grid grid-cols-5 gap-2 md:gap-8 m-auto max-w-full">
                                            {words.map((item) => (
                                                <div key={item.id} id={`word-${item.id}`} className={`w-14 h-10 md:w-32 md:h-20 rounded-xl md:rounded-3xl border-2 md:border-4 transition-all ${currentIndex === item.id ? 'bg-yellow-400 border-yellow-600 scale-110 shadow-lg' : 'bg-white border-slate-300'}`}></div>
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="flex flex-col items-center justify-center gap-2 md:gap-6 m-auto">
                                            {[0, 1, 2, 3, 4].map(lineIdx => (
                                                <div key={lineIdx} className="flex gap-2 md:gap-6">
                                                    {words.filter(w => w.lineIndex === lineIdx).map(item => (
                                                        <div key={item.id} id={`word-${item.id}`} className={`w-14 h-10 md:w-32 md:h-20 rounded-full border-2 md:border-4 transition-all ${currentIndex === item.id ? 'bg-yellow-400 border-yellow-600 scale-110 shadow-lg' : 'bg-white border-slate-300'}`}></div>
                                                    ))}
                                                </div>
                                            ))}
                                        </div>
                                    )
                                )}

                                {level === 5 && (
                                    <div className="grid grid-cols-3 gap-3 md:gap-12 m-auto max-w-full">
                                        {words.map((item) => (
                                            <div key={item.id} id={`word-${item.id}`} className={`w-24 h-16 md:w-56 md:h-36 rounded-2xl md:rounded-3xl border-4 md:border-8 flex items-center justify-center text-4xl md:text-7xl font-normal transition-all ${currentIndex === item.id ? 'bg-yellow-400 border-yellow-600 scale-110 shadow-lg text-black' : 'bg-white border-black text-black'}`}>
                                                {item.word}
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {/* LEVEL 1: HIZLI OKU (PİRAMİT) */}
                                {level === 1 && (
                                    <div className="h-full w-full max-w-5xl flex flex-col justify-evenly items-center py-2 px-1">
                                        {[0,1,2,3,4,5,6].map(lineNum => (
                                            <div key={lineNum} className="flex flex-nowrap justify-center items-center gap-2 sm:gap-4 md:gap-8 whitespace-nowrap">
                                                {words.filter(w => w.lineIndex === lineNum).map(item => (
                                                    <div key={item.id} id={`word-${item.id}`} className={`text-[clamp(1.4rem,4.5vw,4.5rem)] px-1.5 sm:px-3 py-0.5 rounded-xl transition-all leading-tight ${currentIndex === item.id ? 'bg-yellow-300 border-b-2 sm:border-b-4 border-yellow-500 scale-105 shadow-md text-black font-normal z-10' : 'text-slate-800 font-normal'}`}>
                                                        {item.word}
                                                    </div>
                                                ))}
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {/* LEVEL 2: METİN OKU */}
                                {level === 2 && (
                                    <div className="h-full w-full max-w-5xl flex flex-col justify-evenly items-center text-center py-4 px-3 sm:px-6">
                                        {(() => {
                                            const lines = []; let currentLine = [];
                                            words.forEach(word => { currentLine.push(word); if (word.isLastWord) { lines.push(currentLine); currentLine = []; } });
                                            if(currentLine.length > 0) lines.push(currentLine);
                                            return lines.map((lineWords, lineIdx) => (
                                                <div key={lineIdx} className="text-balance leading-normal text-[clamp(1.7rem,4.8vw,4rem)]">
                                                    {lineWords.map(item => (
                                                        <span key={item.id} id={`word-${item.id}`} className={`inline-block px-1.5 sm:px-2.5 py-0.5 rounded-xl transition-all mx-1 ${currentIndex === item.id ? 'bg-yellow-300 text-black shadow-md font-normal scale-105 border-b-2 border-yellow-500' : 'text-slate-900'}`}>{item.word}</span>
                                                    ))}
                                                </div>
                                            ));
                                        })()}
                                    </div>
                                )}

                                {level === 3 && (
                                    <div className={`flex flex-col items-center justify-center gap-6 w-full max-w-2xl ${puzzleShake ? 'animate-shake' : ''}`}>
                                        <div className="flex flex-wrap justify-center gap-2 md:gap-4">
                                            {puzzleShuffled.map(charObj => (
                                                <div key={charObj.id} onClick={() => !charObj.isPlaced && handlePoolClick(charObj)} className={`w-14 h-14 sm:w-16 sm:h-16 md:w-24 md:h-24 rounded-2xl flex items-center justify-center text-3xl sm:text-4xl md:text-6xl border-b-4 ${charObj.isPlaced ? 'opacity-0 pointer-events-none' : 'bg-yellow-400 border-yellow-600 text-black shadow-md'}`}>{charObj.char}</div>
                                            ))}
                                        </div>
                                        <div className="flex flex-wrap justify-center gap-2 md:gap-4 bg-white p-4 md:p-8 rounded-3xl border-4 md:border-8 border-slate-200 shadow-md">
                                            {puzzleSlots.map((charObj, idx) => (
                                                <div key={idx} onClick={() => handleSlotClick(idx)} className={`w-14 h-14 sm:w-16 sm:h-16 md:w-24 md:h-24 rounded-2xl flex items-center justify-center text-3xl sm:text-4xl md:text-6xl border-2 md:border-4 ${charObj ? (puzzleSuccess ? 'bg-green-500 border-green-600 text-white' : 'bg-white border-slate-300 text-black') : 'bg-slate-50 border-slate-300'}`}>{charObj ? charObj.char : ''}</div>
                                            ))}
                                        </div>
                                        {puzzleSuccess && <div className="text-5xl md:text-8xl text-green-500 animate-pop-rotate font-normal">HARİKA!</div>}
                                    </div>
                                )}

                                {/* LEVEL 4: HECEDEN KELİMEYE (3'ERLİ YAN YANA, BÜYÜK BOYUT, NET SİYAH ÇİZGİ) */}
                                {level === 4 && sylData && (
                                    <div className="flex flex-col items-center justify-center h-full w-full max-w-6xl gap-6 md:gap-10 py-2">
                                        {/* ÜST PANEL: SOL 3 HECE - SİYAH ÇİZGİ - SAĞ 3 HECE */}
                                        <div className="flex justify-center items-center gap-4 sm:gap-6 md:gap-10 w-full">
                                            {/* SOL HECELER (3'LÜ YAN YANA) */}
                                            <div className="flex flex-wrap sm:flex-nowrap justify-center gap-2 sm:gap-4 md:gap-6">
                                                {sylData.options1.map((s, i) => (
                                                    <button 
                                                        key={i} 
                                                        onClick={() => handleSyl1Click(s)} 
                                                        className={`w-20 h-16 sm:w-32 sm:h-24 md:w-48 md:h-32 rounded-2xl md:rounded-3xl text-3xl sm:text-5xl md:text-6xl font-normal border-b-4 md:border-b-8 transition-all active:translate-y-1 shadow-lg ${selectedSyl1 === s ? 'bg-blue-500 text-white border-blue-700 scale-105' : 'bg-blue-100 text-black border-blue-300 hover:bg-blue-200'}`}
                                                    >
                                                        {s}
                                                    </button>
                                                ))}
                                            </div>

                                            {/* DİK SİYAH AYIRICI ÇİZGİ */}
                                            <div className="w-1.5 md:w-2 h-20 sm:h-28 md:h-36 bg-black rounded-full shrink-0"></div>

                                            {/* SAĞ HECELER (3'LÜ YAN YANA) */}
                                            <div className="flex flex-wrap sm:flex-nowrap justify-center gap-2 sm:gap-4 md:gap-6">
                                                {sylData.options2.map((s, i) => (
                                                    <button 
                                                        key={i} 
                                                        onClick={() => handleSyl2Click(s)} 
                                                        className={`w-20 h-16 sm:w-32 sm:h-24 md:w-48 md:h-32 rounded-2xl md:rounded-3xl text-3xl sm:text-5xl md:text-6xl font-normal border-b-4 md:border-b-8 transition-all active:translate-y-1 shadow-lg ${selectedSyl2 === s ? 'bg-rose-500 text-white border-rose-700 scale-105' : 'bg-rose-100 text-black border-rose-300 hover:bg-rose-200'}`}
                                                    >
                                                        {s}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        {/* ALT BİRLEŞTİRME KUTULARI VE SONUÇ ALANI */}
                                        <div className="flex flex-col items-center gap-4 md:gap-6 mt-2 md:mt-4 w-full">
                                            <div className="flex gap-4 sm:gap-6 md:gap-8">
                                                <div className={`w-28 h-20 sm:w-36 sm:h-24 md:w-52 md:h-32 rounded-2xl md:rounded-3xl border-4 md:border-8 flex items-center justify-center text-4xl sm:text-5xl md:text-7xl font-normal bg-white transition-all ${shakeLeft ? 'animate-shake border-red-400' : (selectedSyl1 ? 'border-blue-500 text-black shadow-md' : 'border-slate-300 text-slate-300')}`}>
                                                    {selectedSyl1 || "?"}
                                                </div>
                                                <div className={`w-28 h-20 sm:w-36 sm:h-24 md:w-52 md:h-32 rounded-2xl md:rounded-3xl border-4 md:border-8 flex items-center justify-center text-4xl sm:text-5xl md:text-7xl font-normal bg-white transition-all ${shakeRight ? 'animate-shake border-red-400' : (selectedSyl2 ? 'border-rose-500 text-black shadow-md' : 'border-slate-300 text-slate-300')}`}>
                                                    {selectedSyl2 || "?"}
                                                </div>
                                            </div>

                                            {/* BAŞARI KUTUSU */}
                                            <div className={`transition-all duration-300 flex items-center justify-center rounded-2xl md:rounded-3xl px-8 py-3 md:px-16 md:py-6 shadow-xl min-w-[240px] md:min-w-[420px] min-h-[70px] md:min-h-[110px] ${sylSuccess ? 'bg-green-400 border-4 md:border-6 border-green-600 animate-pop-up' : 'bg-slate-100 border-2 md:border-4 border-slate-200'}`}>
                                                {sylSuccess && <div className="text-white text-5xl sm:text-6xl md:text-8xl font-normal tracking-wider drop-shadow-sm">{sylData.target}</div>}
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>

                {/* YAZDIRMA ŞABLONU */}
                {printData && (
                    <div className="print-show hidden bg-white text-black font-['TemelYazi']">
                        {printData.level === 1 ? (() => {
                            const setData = PYRAMID_CONTENT[printData.idx % PYRAMID_CONTENT.length]; 
                            const lines = [ [setData.s], [setData.s, setData.v], [setData.s, setData.o, setData.v], [setData.s, setData.a, setData.o, setData.v], [setData.s, setData.o, setData.v], [setData.s, setData.v], [setData.s] ];
                            return (
                                <div className="flex flex-col items-center w-full h-[267mm]">
                                    <div className="w-full flex justify-between items-end border-b-[3px] border-slate-300 pb-4 opacity-50 shrink-0">
                                        <h2 className="text-4xl text-slate-600 font-normal">Okuma Çalışmaları</h2>
                                        <span className="text-2xl text-slate-500 font-normal tracking-widest">OKULMATİK</span>
                                    </div>
                                    <div className="flex flex-col items-center justify-evenly flex-1 w-full py-10">
                                        {lines.map((line, i) => (
                                            <div key={i} className="text-[4rem] leading-[1.5] text-black font-normal text-center w-full">{line.join(' ')}</div>
                                        ))}
                                    </div>
                                </div>
                            );
                        })() : (() => {
                            const story = STORIES[printData.idx % STORIES.length];
                            const sentences = story.split('. ').filter(s => s.trim().length > 0);
                            return (
                                <div className="flex flex-col w-full h-[267mm]">
                                    <div className="w-full flex justify-between items-end border-b-[3px] border-slate-300 pb-4 mb-12 opacity-50 shrink-0">
                                        <h2 className="text-4xl text-slate-600 font-normal">Okuma Çalışmaları</h2>
                                        <span className="text-2xl text-slate-500 font-normal tracking-widest">OKULMATİK</span>
                                    </div>
                                    <div className="flex flex-col flex-1 w-full justify-evenly pl-8">
                                        {sentences.map((sentence, i) => (
                                            <div key={i} className="text-[3.5rem] leading-tight text-black font-normal w-full text-left">
                                                {sentence.trim() + (sentence.endsWith('.') ? '' : '.')}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            );
                        })()}
                    </div>
                )}
                </React.Fragment>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ReadingApp />);
    </script>
</body>
</html>
